<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Session Findings</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2328;--mute:#59636e;--line:#d0d7de;--acc:#0969da;--bad:#cf222e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mute:#9aa4ae;--line:#30363d;--acc:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--mute:#9aa4ae;--line:#30363d;--acc:#58a6ff}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,"Noto Sans",Helvetica,Arial,sans-serif}
#login{max-width:360px;margin:12vh 16px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 28px 22px}
@media (min-width:420px){#login{margin:12vh auto}}
#login h1{font-size:20px;margin:0 0 16px}label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:15px}
button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
#view{display:none}#bar{position:sticky;top:0;z-index:9;background:#24292f;color:#fff;padding:6px 16px;font-size:13px;display:flex;justify-content:flex-end;gap:14px}
#bar a{color:#fff;cursor:pointer}iframe{border:0;width:100%;height:calc(100vh - 32px);display:block;background:var(--bg)}
</style></head><body>
<div id="login"><h1>Claude Session Findings</h1>
<form id="f"><label>Username</label><input id="u" autocomplete="username" autofocus><label>Password</label><input id="p" type="password" autocomplete="current-password"><button id="b">Login</button><div class="err" id="e"></div></form></div>
<div id="view"><div id="bar"><a id="home">Sessions</a><a id="out">Logout</a></div><iframe id="fr"></iframe></div>
<script>
(async () => {
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const MAX_BEFORE_SWITCH = 3, LOCK_AFTER = 10, LOCK_MS = 60 * 60 * 1000;
const ck = (k, v) => { if (v === undefined) return (document.cookie.match('(^|;)\\s*' + k + '=([^;]*)') || [])[2]; document.cookie = k + '=' + v + ';max-age=31536000;path=/;SameSite=Strict'; };
const fails = () => Math.max(+(localStorage.getItem('fx') || 0), +(ck('fx') || 0));
const setFails = n => { localStorage.setItem('fx', n); ck('fx', n); };
const lockedUntil = () => Math.max(+(localStorage.getItem('lk') || 0), +(ck('lk') || 0));

let bundle = null, site = null;
async function load() { if (!bundle) bundle = await (await fetch('bundle.json', { cache: 'no-store' })).json(); return bundle; }
async function unwrap(user, pw, idx) {
  const bd = await load();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user + ':' + pw), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(bd.salt), iterations: bd.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const w = bd.wraps[idx];
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(w.nonce) }, kek, b64(w.ct)));
}
async function openSite(rawKey) {
  const bd = await load();
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(bd.nonce) }, key, b64(bd.ct));
  site = JSON.parse(new TextDecoder().decode(plain));
  sessionStorage.setItem('k', btoa(String.fromCharCode(...rawKey)));
  $('login').style.display = 'none'; $('view').style.display = 'block';
  show(location.hash.slice(1) || 'index.html');
}
function show(name) {
  let h = site.pages[name] || ('<p style="font-family:sans-serif;padding:20px">not found: ' + name + '</p>');
  h = h.replace(/(src|href)="(assets\/[^"]+)"/g, (m, a, p) => site.assets[p] ? a + '="' + site.assets[p] + '"' : m);
  h = h.replace(/href="([^"#:]+\.html)"/g, 'href="#$1" data-page="$1"');
  h = h.replace('</head>', '<script>document.addEventListener("click",e=>{const a=e.target.closest("a[data-page]");if(a){e.preventDefault();parent.postMessage({page:a.dataset.page},"*");}});<\/script></head>');
  $('fr').srcdoc = h; history.replaceState(null, '', '#' + name); window.scrollTo(0, 0);
}
window.addEventListener('message', e => { if (e.data && e.data.page) show(e.data.page); });
window.addEventListener('hashchange', () => { if (site) show(location.hash.slice(1) || 'index.html'); });
$('home').onclick = () => show('index.html');
$('out').onclick = () => { sessionStorage.removeItem('k'); history.replaceState(null, '', location.pathname); location.reload(); };

$('f').onsubmit = async ev => {
  ev.preventDefault(); $('e').textContent = '';
  if (Date.now() < lockedUntil()) { $('e').textContent = 'Too many attempts. Try again in ' + Math.ceil((lockedUntil() - Date.now()) / 60000) + ' min.'; return; }
  $('b').disabled = true;
  const user = $('u').value.trim(), pw = $('p').value;
  const idx = fails() >= MAX_BEFORE_SWITCH ? 1 : 0;      // after 3 wrong attempts only the alternate password works
  try { const k = await unwrap(user, pw, idx); setFails(0); await openSite(k); }
  catch (_) {
    const n = fails() + 1; setFails(n);
    if (n >= LOCK_AFTER) { const t = Date.now() + LOCK_MS; localStorage.setItem('lk', t); ck('lk', t); $('e').textContent = 'Blocked for 1 hour.'; }
    else $('e').textContent = 'Wrong username or password (' + n + ').';
  }
  $('b').disabled = false;
};
const saved = sessionStorage.getItem('k');
if (saved) { try { await openSite(b64(saved)); } catch (_) { sessionStorage.removeItem('k'); } }
})();
</script></body></html>
